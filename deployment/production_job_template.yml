# Phase 10.5 — Production Job Template
# TEMPLATE ONLY. Adapt to the organization's approved Databricks Jobs/IaC standard.
# No credentials are included.

job_name: GWPC_DataVault_Production

target:
  dbt_target: prod
  catalog: autdbt_vault_prod
  schema: autdbtt

steps:
  - name: dbt_debug
    command: dbt debug --target prod

  - name: dbt_deps
    command: dbt deps --target prod

  - name: dbt_parse
    command: dbt parse --target prod

  - name: dbt_build
    command: dbt build --target prod

  - name: operational_tests
    command: dbt test --target prod --select path:tests/operational

failure_policy:
  stop_on_failure: true
  retry_transient_failures: true
  max_retry_attempts: 1
  do_not_auto_retry_data_quality_failures: true

alerts:
  on_job_failure: true
  on_test_failure: true
  on_repeated_retry: true
