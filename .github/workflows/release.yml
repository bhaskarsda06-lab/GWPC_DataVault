name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag format
        shell: bash
        run: |
          [[ "${{ inputs.release_version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Create release tag
        run: |
          git tag "${{ inputs.release_version }}"
          git push origin "${{ inputs.release_version }}"
