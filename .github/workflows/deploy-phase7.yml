name: Deploy Databricks Bundle - Phase 7

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
      run_job:
        description: "Run the deployed job"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t ${{ inputs.environment }}

      - name: Deploy bundle
        run: databricks bundle deploy -t ${{ inputs.environment }}

      # The job execution should be enabled only after environment-specific
      # approvals and required variables are configured.
      - name: Run production workflow
        if: ${{ inputs.run_job }}
        run: databricks bundle run gwpc_datavault_production -t ${{ inputs.environment }}
