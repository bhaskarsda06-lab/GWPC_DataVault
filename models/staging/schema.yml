version: 2

models:

  # ============================================================
  # ACCOUNT
  # ============================================================
  - name: stg_account
    description: "Filtered GWPC account source."

    tests:
      - reconciliation_source_staging:
          arguments:
            source_table: "{{ source('gwpc', 'pc_account_curr') }}"
            source_key: publicid
            staging_key: publicid

    columns:
      - name: publicid
        description: "GWPC account public identifier."
        tests:
          - not_null
          - unique


  # ============================================================
